<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Drug Administration (TypeScript, rivarts)</title>
  <style>
    :root { --bg: linear-gradient(135deg, #f6f0df 0%, #daeaf2 100%); --panel: rgba(255, 252, 247, 0.92); --ink: #1d2b2a; --muted: #586569; --line: rgba(57, 71, 72, 0.16); --accent: #9b3d2f; --accent-soft: rgba(155, 61, 47, 0.1); }
    body { background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; margin: 0; padding: 24px; min-height: 100vh; box-sizing: border-box; }
    h1 { text-align: center; margin: 0 0 24px; font-size: clamp(2rem, 4vw, 3.25rem); letter-spacing: 0.03em; }
    .layout { display: grid; gap: 24px; max-width: 1120px; margin: 0 auto; align-items: start; }
    .panel { background: var(--panel); box-shadow: 0 20px 60px rgba(23, 34, 35, 0.12); border: 1px solid rgba(255, 255, 255, 0.55); border-radius: 22px; backdrop-filter: blur(10px); }
    table { border-collapse: collapse; width: 100%; overflow: hidden; }
    td { border: 1px solid #d7dce0; padding: 16px; text-align: center; }
    input { border: 1px solid #ced4da; border-radius: 8px; text-align: center; font-weight: 700; padding: 10px 8px; min-width: 100px; width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.9); }
    input[type="number"] { max-width: 120px; }
    input[readonly] { background: #fbfbfb; font-style: italic; }
    .label-cell { background: #f7fafc; font-weight: 700; }
    .table-wrap { padding: 18px; }
    .trace-panel { padding: 22px; }
    .trace-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .trace-panel h2 { margin: 0; font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .trace-panel p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
    .trace-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .trace-action { border: 1px solid rgba(155, 61, 47, 0.3); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 0.9rem; cursor: pointer; transition: background 120ms ease, transform 120ms ease; }
    .trace-action:hover { background: rgba(155, 61, 47, 0.18); transform: translateY(-1px); }
    .trace-status { margin: 0 0 14px; min-height: 1.2em; color: var(--accent); font-size: 0.92rem; }
    pre { margin: 0; padding: 18px; background: #1e1f1c; color: #f7f2df; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); font-family: 'Courier New', monospace; font-size: 0.95rem; line-height: 1.65; white-space: pre-wrap; min-height: 150px; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr); }
    }
  </style>
  <script type="module" src="./DrugAdministration.js"></script>
</head>
<body>
  <h1>Drug Administration Trace</h1>
  <div class="layout">
    <section class="panel table-wrap">
      <table>
        <tr>
          <td>Drug</td>
          <td>Concentration</td>
          <td>VolumeOfFluid</td>
        </tr>
        <tr>
          <td><input id="drug" type="number"></td>
          <td><input id="concentration" type="number" step="0.01"></td>
          <td><input id="volume" type="number"></td>
        </tr>
        <tr>
          <td>Dose</td>
          <td>Duration</td>
          <td>Rate</td>
        </tr>
        <tr>
          <td><input id="dose" type="number"></td>
          <td><input id="duration" type="number"></td>
          <td><input id="rate" type="number"></td>
        </tr>
      </table>
    </section>
    <aside class="panel trace-panel">
      <div class="trace-head">
        <h2>Trace</h2>
        <div class="trace-actions">
          <button id="copy-trace" class="trace-action" type="button">Copy Trace</button>
          <button id="clear-trace" class="trace-action" type="button">Clear</button>
        </div>
      </div>
      <p>Enter values to generate trace entries. The page starts empty.</p>
      <div id="trace-status" class="trace-status"></div>
      <pre id="trace-output">No trace yet.</pre>
    </aside>
  </div>
</body>
</html>
